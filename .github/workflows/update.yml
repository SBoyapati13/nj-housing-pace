name: Update from new permit and completion data

on:
  schedule:
    - cron: "37 13 * * 1"   # every Monday 13:37 UTC; Census and the state each post monthly
  workflow_dispatch:         # run on demand from the Actions tab
  push:
    branches: [main]
    paths: ["docs/**"]       # redeploy the map when the site itself is edited

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nj-housing-pace
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/update.py
      - name: Commit only if new data arrived
        run: |
          git config user.name "nj-housing-pace bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit when a source published new or revised files, the run log gained an entry,
          # or the health status changed (so a stale-source warning is published even with no new data).
          # Anything else (e.g. PNGs re-rendered with a different font stack) is discarded.
          if git diff --quiet -- data/raw/bps/manifest.json data/raw/dca_bp/manifest.json data/raw/co/manifest.json data/runs.jsonl data/health.json; then
            echo "No new data and no change in health this week."
            git checkout -- .
            git clean -fdq -- data/history
            exit 0
          fi
          git add -A
          V=$(python -c "import json; s=json.load(open('out/summary.json')); print(f\"Census through {s['vintage']}, state through {s['dca_vintage']}, health {s['health']['overall']}\")")
          git commit -m "Data update: ${V}"
          git push

  deploy-map:
    needs: update
    if: ${{ always() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # pick up the commit the update job just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
